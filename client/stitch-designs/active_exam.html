<div class="size-10 rounded-xl bg-white border border-slate-200 text-slate-500 flex items-center justify-center font-bold text-lg group-hover:bg-slate-100">D</div>
<span class="text-lg font-medium text-slate-700">2x² + 9</span>

<div class="size-10 rounded-xl bg-white border border-slate-200 text-slate-500 flex items-center justify-center font-bold text-lg group-hover:bg-slate-100">E</div>

<span class="material-symbols-outlined">arrow_back</span>

<button class="flex items-center gap-2 px-8 py-3 rounded-xl bg-primary text-white font-semibold hover:bg-blue-600 transition-colors shadow-md shadow-blue-500/20">

<button class="aspect-square rounded-lg flex items-center justify-center text-sm font-bold bg-slate-300 text-slate-600">8</button>

<button class="aspect-square rounded-lg flex items-center justify-center text-sm font-bold bg-slate-300 text-slate-600">10</button>

<script>
                        for(let i=11; i<=50; i++) {
